name: Build Diagnostics
on:
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --version
          npm --version
          test -f package.json
          npm install
          npm ls --depth=0
